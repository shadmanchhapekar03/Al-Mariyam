<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:0.7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="400" fill="#f8f8f8"/>

  <!-- Shadow -->
  <ellipse cx="150" cy="370" rx="80" ry="12" fill="#00000015"/>
  <!-- Oximeter clip -->
  <rect x="100" y="80" width="100" height="60" rx="8" fill="#3498db" stroke="#333" stroke-width="2"/>

  <!-- Display area -->
  <rect x="110" y="95" width="80" height="40" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="150" y="118" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
    98%
  </text>

  <!-- Sensor indicators -->
  <circle cx="115" cy="175" r="8" fill="#ff6b6b"/>
  <circle cx="150" cy="175" r="8" fill="#4CAF50"/>
  <circle cx="185" cy="175" r="8" fill="#666"/>

  <!-- Fingers representation -->
  <rect x="125" y="210" width="15" height="50" rx="3" fill="#ffcc99" stroke="#333" stroke-width="1.5"/>
  <rect x="160" y="210" width="15" height="50" rx="3" fill="#ffcc99" stroke="#333" stroke-width="1.5"/>

  <!-- Title -->
  <text x="150" y="310" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#3498db">
    Pulse Oximeter
  </text>
  <text x="150" y="330" font-family="Arial" font-size="10" text-anchor="middle" fill="#999">
    SpO₂ & Heart Rate
  </text>
</svg>