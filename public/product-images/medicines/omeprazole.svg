<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="botGrad" x1="0%" y1="0%" x2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#9b59b6;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#fff;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="400" fill="#f5f5f5"/>

  <!-- Shadow -->
  <ellipse cx="150" cy="385" rx="80" ry="12" fill="#00000015"/>

  <!-- Cap -->
  <rect x="125" y="15" width="50" height="18" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/>
  <circle cx="150" cy="18" r="32" fill="#ffffff" opacity="0.25"/>

  <!-- Neck -->
  <path d="M 130 33 L 115 65 L 185 65 L 170 33 Z" fill="url(#botGrad)" stroke="#333" stroke-width="1.5"/>

  <!-- Body -->
  <path d="M 115 65 Q 100 110 100 170 Q 100 240 125 310 L 175 310 Q 200 240 200 170 Q 200 110 185 65 Z"
        fill="url(#botGrad)" stroke="#333" stroke-width="2" opacity="0.85"/>

  <!-- Shine -->
  <ellipse cx="130" cy="120" rx="14" ry="45" fill="url(#shine)"/>

  <!-- Label -->
  <rect x="112" y="140" width="76" height="100" rx="3" fill="#fff" stroke="#ccc" stroke-width="1" opacity="0.95"/>

  <!-- Label text -->
  <text x="150" y="168" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#9b59b6">
    Omeprazole
  </text>
  <text x="150" y="188" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#666">
    500mg
  </text>
  <text x="150" y="205" font-family="Arial,sans-serif" font-size="8" text-anchor="middle" fill="#999">
    Pharma Grade
  </text>

  <!-- Bottom shine -->
  <ellipse cx="150" cy="310" rx="55" ry="8" fill="#ffffff" opacity="0.15"/>
</svg>